# DESIGN.md §2.8. One GHC, because base ^>=4.21.2.0 admits only 9.12 (D12).
# Steps 1–7 are Stage 0's exit condition; step 8, the benchmark gate (§8.6),
# arrived with milestone 1a and is the bench job.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# An explicit bash runs with -o pipefail, so a failing `cabal haddock` fails
# its step even though check-haddock.py at the end of the pipe exits 0.
defaults:
  run:
    shell: bash

env:
  GHC_VERSION: "9.12.4"
  CABAL_VERSION: "3.16.1.0"
  DOCTEST_VERSION: "0.25.0"
  # CI runs the property tests with a fixed seed and prints it on failure
  # (§7.3); a nightly job will run random seeds at a larger count.
  QUICKCHECK_SEED: "20261004"
  # The same flags on every cabal command, so no step reconfigures the build.
  CABAL_FLAGS: --enable-tests --enable-benchmarks --ghc-options=-Werror

jobs:
  build:
    name: Build, test, doctest, haddock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: true

      - name: Resolve the build plan
        run: cabal build all $CABAL_FLAGS --dry-run

      - name: Restore the cabal store
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-doctest-${{ env.DOCTEST_VERSION }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-doctest-${{ env.DOCTEST_VERSION }}-

      - name: Build dependencies
        run: |
          cabal build all $CABAL_FLAGS --only-dependencies
          cabal build all $CABAL_FLAGS -f intern --only-dependencies

      - name: Install doctest
        run: |
          cabal install doctest-$DOCTEST_VERSION --overwrite-policy=always --installdir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Save the cabal store
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # 1
      - name: Build, with -Werror
        run: cabal build all $CABAL_FLAGS

      # 2
      - name: Test
        run: cabal test cassini-test $CABAL_FLAGS --test-show-details=direct --test-options="--quickcheck-replay=$QUICKCHECK_SEED"

      # 4, before the flag flips, so it reuses step 1's build
      - name: Doctest
        run: cabal repl $CABAL_FLAGS --with-repl=doctest --repl-options=-Wno-missing-export-lists lib:cassini-core

      # 7
      - name: Haddock, with a coverage floor
        run: cabal haddock $CABAL_FLAGS --haddock-quickjump lib:cassini-core 2>&1 | python3 scripts/check-haddock.py

      # 3: both implementations of Cassini.Core.Intern, on every commit (§3.4)
      - name: Build and test with the intern flag, with -Werror
        run: |
          cabal build all $CABAL_FLAGS -f intern
          cabal test cassini-test $CABAL_FLAGS -f intern --test-show-details=direct --test-options="--quickcheck-replay=$QUICKCHECK_SEED"

      # 4, under the intern flag
      - name: Doctest with the intern flag
        run: cabal repl $CABAL_FLAGS -f intern --with-repl=doctest --repl-options=-Wno-missing-export-lists lib:cassini-core

  # 8: the allocation gate on the end-to-end workload (§8.6), under each intern
  # setting against its own baseline. Allocation does not depend on the
  # machine, so a developer machine's baseline holds here. Time is reported,
  # not gated, until a baseline from this runner class is committed.
  bench:
    name: Benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: true

      - name: Resolve the build plan
        run: cabal build all $CABAL_FLAGS --dry-run

      - name: Restore the cabal store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-doctest-${{ env.DOCTEST_VERSION }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-doctest-${{ env.DOCTEST_VERSION }}-

      - name: Allocation gate
        run: |
          cabal bench cassini-bench $CABAL_FLAGS --benchmark-options="-p EndToEnd --csv $RUNNER_TEMP/out-hash.csv"
          python3 cassini-core/bench/check-allocation.py --only All.EndToEnd cassini-core/bench/baseline/ghc-9.12.4-hash.csv "$RUNNER_TEMP/out-hash.csv"

      - name: Allocation gate with the intern flag
        run: |
          cabal bench cassini-bench $CABAL_FLAGS -f intern --benchmark-options="-p EndToEnd --csv $RUNNER_TEMP/out-intern.csv"
          python3 cassini-core/bench/check-allocation.py --only All.EndToEnd cassini-core/bench/baseline/ghc-9.12.4-intern.csv "$RUNNER_TEMP/out-intern.csv"

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    env:
      HLINT_VERSION: "3.10"
      ORMOLU_VERSION: "0.8.0.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install hlint and ormolu
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/ndmitchell/hlint/releases/download/v$HLINT_VERSION/hlint-$HLINT_VERSION-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          # hlint finds its data/ directory beside the binary, so it stays where it unpacked.
          echo "$RUNNER_TEMP/hlint-$HLINT_VERSION" >> "$GITHUB_PATH"
          curl -sSfL -o "$RUNNER_TEMP/ormolu.zip" "https://github.com/tweag/ormolu/releases/download/$ORMOLU_VERSION/ormolu-x86_64-linux.zip"
          unzip -o -q "$RUNNER_TEMP/ormolu.zip" -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ormolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 5
      - name: hlint
        run: hlint --ignore-glob='lint/fixtures/**' .

      - name: Layering fixtures (§2.6)
        run: lint/check-layering.sh

      - name: Common stanzas agree across packages (§2.4)
        run: scripts/check-common-stanzas.sh

      # 6: ormolu reads default-extensions from the cabal file; never --no-cabal (§2.5)
      - name: ormolu
        run: ormolu --mode check $(git ls-files '*.hs')
